version: '3.9'

services:
  api:
    image: otica-couple-api:dev
    build:
      context: ./api
      target: build
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      DOTNET_USE_POLLING_FILE_WATCHER: '1'
      DB_CONNECTION: ${DB_CONNECTION:?DB_CONNECTION is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
    ports:
      - '5000:8080'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./api:/src
      - /src/bin
      - /src/obj
    working_dir: /src
    command: dotnet watch run --project OticaCouple.Api.csproj --no-launch-profile --urls http://0.0.0.0:8080
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - backend

  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: oticaos_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - '5432:5432'
    volumes:
      - oticacouple_postgres_data:/var/lib/postgresql/data
      - ./infra:/seed:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d oticaos_dev']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - backend

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - oticacouple_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - backend

  adminer:
    image: adminer:latest
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    networks:
      - backend

networks:
  backend:

volumes:
  oticacouple_postgres_data:
  oticacouple_redis_data:
