name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  build-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      coverage: ${{ steps.coverage.outputs.line_coverage }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: api/OticaCouple.Api.csproj

      - name: Restore API dependencies
        working-directory: api
        run: dotnet restore OticaCouple.Api.csproj

      - name: Build API
        working-directory: api
        run: dotnet build OticaCouple.Api.csproj --no-restore -c Release

      - name: Run xUnit tests with coverage
        working-directory: api
        run: dotnet test OticaCouple.Api.csproj --no-build -c Release --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Add ReportGenerator to PATH
        run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Generate coverage report
        working-directory: api
        run: reportgenerator -reports:"coverage/**/coverage.cobertura.xml" -targetdir:"coverage/report" -reporttypes:"TextSummary;Cobertura"

      - name: Capture coverage percentage
        id: coverage
        working-directory: api
        shell: bash
        run: |
          summary_file="$(find coverage/report -iname 'Summary.txt' | head -n 1)"

          if [ -z "$summary_file" ]; then
            echo "Coverage summary was not generated."
            exit 1
          fi

          line_coverage="$(grep -Eo 'Line coverage: [0-9.]+%' "$summary_file" | head -n 1 | grep -Eo '[0-9.]+')"

          if [ -z "$line_coverage" ]; then
            echo "Unable to parse line coverage from $summary_file"
            exit 1
          fi

          echo "line_coverage=$line_coverage" >> "$GITHUB_OUTPUT"

      - name: Upload API coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: api/coverage
          if-no-files-found: error

      - name: Fail if coverage is below 80%
        working-directory: api
        shell: bash
        run: |
          awk -v coverage="${{ steps.coverage.outputs.line_coverage }}" 'BEGIN { exit (coverage + 0 < 80) ? 1 : 0 }'

  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: TypeScript check
        working-directory: web
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: web
        run: npx eslint src --ext .ts,.tsx --max-warnings 0

      - name: Build web app
        working-directory: web
        run: npm run build

      - name: Upload web dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

